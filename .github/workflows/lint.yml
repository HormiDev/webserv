name: Lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-cpp98:
    name: Build (strict C++98)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with project Makefile
        env:
          TERM: xterm-256color
        run: make re

      - name: Compile every .cpp directly with -std=c++98 -Wall -Wextra -Werror
        run: |
          set -e
          shopt -s globstar nullglob
          files=(srcs/**/*.cpp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .cpp files found under srcs/"; exit 1
          fi
          echo "Checking: ${files[*]}"
          for f in "${files[@]}"; do
            echo "::group::$f"
            c++ -std=c++98 -Wall -Wextra -Werror -Iincludes -c "$f" -o /dev/null
            echo "::endgroup::"
          done

      - name: fclean
        if: always()
        env:
          TERM: xterm-256color
        run: make fclean

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # need a real ref (not detached HEAD) so we can push back to it
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Collect source files
        id: files
        run: |
          shopt -s globstar nullglob
          files=(srcs/**/*.cpp includes/**/*.hpp includes/**/*.h)
          echo "list=${files[*]}" >> "$GITHUB_OUTPUT"

      # --- On a direct push: auto-fix and commit the result ---
      - name: Auto-format
        if: github.event_name == 'push'
        run: |
          set -e
          files=(${{ steps.files.outputs.list }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No source files found"; exit 0
          fi
          clang-format -i "${files[@]}"

      - name: Commit formatting fixes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Nothing to format, all good."
            exit 0
          fi
          git config user.name "clang-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: auto clang-format [skip ci]"
          git push

      # --- On a pull request: just check, don't push to someone else's branch ---
      - name: Check formatting (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          set -e
          files=(${{ steps.files.outputs.list }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No source files found"; exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
