# Archivos estaticos, listado de directorios y opciones omitidas.
server
{
	listen localhost:8080;
	server_name static-tests.local;
	root ./www/server-root;
	index server-index.html;

	location /
	{
		root ./www/static;
		index index.html;
		autoindex off;
		allowed_methods GET;
	}

	location /listing
	{
		root ./www/files;
		autoindex on;
		allowed_methods GET DELETE;
	}

	# Todos los has... deben quedar en false: no se aplica herencia al parsear.
	location /omitted
	{
	}
}

# Subidas y asociaciones CGI independientes en el mismo servidor.
server
{
	listen localhost:8081;
	server_name uploads-cgi-tests.local;
	client_max_body_size 10M;

	location /uploads
	{
		root ./www;
		allowed_methods POST DELETE;
		upload_store "./www/uploads with spaces";
	}

	location /python
	{
		root ./www/cgi;
		allowed_methods GET POST;
		cgi .py /usr/bin/python3;
	}

	location /php
	{
		allowed_methods POST;
		cgi .php /usr/bin/php;
	}
}

# Redirecciones a una ruta local y a una URL absoluta.
# El codigo de redireccion soportado actualmente es 301.
server
{
	listen localhost:8082;
	server_name redirects-tests.local;

	location /old
	{
		return 301 /new;
	}

	location /external
	{
		return 301 "https://example.com/new";
	}
}

# Repeticiones: prevalece el ultimo valor unico; los metodos se acumulan.
server
{
	listen localhost:8083;
	server_name repeated-tests.local;

	location /repeat
	{
		root ./www/initial;
		root ./www/final;
		index initial.html;
		index final.html;
		autoindex on;
		autoindex off;
		allowed_methods GET GET;
		allowed_methods POST DELETE GET;
		upload_store ./uploads/initial;
		upload_store ./uploads/final;
		cgi .py /usr/bin/python3;
		cgi .php /usr/bin/php;
		return 301 /initial;
		return 301 /final;
	}

	# Otro location independiente para comprobar el orden de declaracion.
	location /separate
	{
		index separate-entry.html;
	}
	
}
